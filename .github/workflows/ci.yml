name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"

      - run: uv sync --locked

      - name: Format and lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Risk register and golden cases
        run: uv run evalkit check

      - name: Kit unit tests and Layer 1 pipeline tests
        run: uv run pytest

      # Fails on ids that match no risk, and on risks with no case, test or stated manual check.
      - name: Risk coverage
        run: uv run evalkit coverage --strict

      # Real Claude answers, recorded once (qa/recordings/) and replayed here with no model calls.
      - name: Evaluation of recorded Claude answers
        run: >-
          uv run evalkit eval --adapter qa.adapter:make_replay_adapter
          --cases c003-gross-only,c005-prompt-injection --runs 1

      # Fails if a metric got worse, or a case that passed now fails, against qa/history.jsonl.
      - name: Drift of recorded Claude answers
        run: uv run evalkit drift

      # Layer 2 against the demo pipeline. With a real model, run this on prompt or model changes
      # and nightly instead of on every push.
      - name: Evaluation
        run: uv run evalkit eval

      - name: Drift
        run: uv run evalkit drift

      # Seeds faults into the system's answers; the evaluation must notice every one.
      - name: Prove the evaluation can fail
        run: uv run evalkit mutate

      # Layer 3: builds the seeded review queue, so the tooling stays working.
      - name: Oversight queue
        run: uv run evalkit oversight plan

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: eval-report-${{ matrix.os }}
          path: reports/
          retention-days: 14
